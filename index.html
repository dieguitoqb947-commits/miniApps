<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Filtro de Cards</title>
    <link rel="stylesheet" href="src/styles/style.css" />
  </head>
  <body>
    <label for="category-select">Filtrar por categoría:</label>
    <select id="category-select">
      <option value="all">All</option>
      <option value="tech">Tech</option>
      <option value="clothes">Clothes</option>
      <option value="empty">Empty Category (Test)</option>
      <option value="home">Home</option>
    </select>

    <div id="cards-container"></div>

    <section class="search-section">
      <h1 class="search-title">Buscador de Usuarios</h1>
      <div id="search" class="search-container">
        <form id="search-form">
          <input
            type="text"
            id="search-input"
            placeholder="Buscar por nombre..."
          />
          <button type="button" id="search-button">Buscar</button>
        </form>
      </div>
    </section>

    <div id="usuarios-container"></div>

    <section class="todo_container">
      <h1 class="todo_title">To-do List</h1>
      <form id="todo_form">
        <input type="text" id="task_input" placeholder="Agregar tarea" />
        <button type="submit" id="add_button">Agregar</button>
      </form>
      <ul id="task_list"></ul>
    </section>

    <section class="shopping">
      <div class="shopping-container">
        <section class="products-container">
          <div class="products_header">
            <h2>Productos</h2>
            <button
              id="add_new_product"
              type="button"
              class="new_product_button"
            >
              Agregar Nuevo Producto
            </button>
            <dialog
              id="new_product_modal"
              class="new_product_modal"
              aria-labelledby="new_product_title"
            >
              <h2 id="new_product_title" class="new_product_title">
                Agregar Nuevo Producto
              </h2>

              <form id="new_product_form" class="new_product_form">
                <label for="new_product_name">Nombre del producto</label>
                <input
                  type="text"
                  id="new_product_name"
                  placeholder="Nombre del producto"
                  required
                />
                <label for="new_product_price">Precio del producto</label>
                <input
                  type="number"
                  id="new_product_price"
                  placeholder="Precio del producto"
                  min="0"
                  step="0.01"
                  required
                />
                <button type="submit" class="save_button" id="save_new_product">
                  Guardar Producto
                </button>
                <button
                  type="button"
                  id="close_new_product_modal"
                  class="close_button"
                >
                  Cancelar
                </button>
              </form>
            </dialog>
          </div>

          <ul id="products-list"></ul>
        </section>

        <section class="cart-container">
          <h2>Carrito</h2>
          <ul id="cart-list"></ul>
          <p class="cart-total">Total: <span id="cart-total">$0</span></p>
          <button id="pay_button" class="pay_button" disabled>Pagar</button>
        </section>
      </div>
    </section>

    <script src="src/apps/card-filter/filterCards.js"></script>
    <script src="src/apps/user-search/findUsers.js"></script>
    <script src="src/apps/todo-list/todoList.js"></script>
    <script src="src/apps/shopping-cart/shoppingCart.js"></script>
  </body>
</html>
